name: dio_server_clock
description: "Tamper-resistant server time for Dio apps. Reads the HTTP Date header from responses you already make and anchors it to a monotonic clock."
version: 0.1.0
homepage: https://github.com/BaluVadivel/dio_server_clock
repository: https://github.com/BaluVadivel/dio_server_clock.git
issue_tracker: https://github.com/BaluVadivel/dio_server_clock/issues
documentation: https://github.com/BaluVadivel/dio_server_clock#readme

license: MIT

topics:
  - dio
  - time
  - clock
  - http
  - interceptor

environment:
  sdk: ^3.7.2

dependencies:
  clock: ^1.1.1
  # Supports Dio 4.x and 5.x; don't use Dio 5-only APIs in lib/.
  dio: ">=4.0.0 <6.0.0"
  http_parser: ^4.0.2

dev_dependencies:
  fake_async: ^1.3.1
  lints: ^5.0.0
  test: ^1.25.0
